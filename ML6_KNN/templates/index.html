<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Diabetes Prediction</title>

    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea, #764ba2);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px;
        }

        .container {
            width: 100%;
            max-width: 700px;
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 10px;
        }

        .description {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        label {
            margin-bottom: 7px;
            font-weight: bold;
            color: #444;
        }

        input {
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #667eea;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #667eea;
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #5568d9;
        }

        .result {
            margin-top: 25px;
            padding: 20px;
            text-align: center;
            border-radius: 10px;
            background: #f1f3ff;
        }

        .result h2 {
            margin: 0 0 10px;
            color: #333;
        }

        .result p {
            margin: 5px;
            font-size: 17px;
        }

        .error {
            margin-top: 20px;
            padding: 15px;
            text-align: center;
            background: #ffe5e5;
            color: #d00;
            border-radius: 8px;
        }

        @media (max-width: 600px) {
            .form-grid {
                grid-template-columns: 1fr;
            }

            .container {
                padding: 25px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Diabetes Prediction</h1>

        <p class="description">
            Enter the patient's medical information to predict diabetes.
        </p>

        <form action="/predict" method="POST">

            <div class="form-grid">

                <div class="form-group">
                    <label for="Pregnancies">Pregnancies</label>
                    <input
                        type="number"
                        step="any"
                        name="Pregnancies"
                        id="Pregnancies"
                        required>
                </div>

                <div class="form-group">
                    <label for="Glucose">Glucose</label>
                    <input
                        type="number"
                        step="any"
                        name="Glucose"
                        id="Glucose"
                        required>
                </div>

                <div class="form-group">
                    <label for="BloodPressure">Blood Pressure</label>
                    <input
                        type="number"
                        step="any"
                        name="BloodPressure"
                        id="BloodPressure"
                        required>
                </div>

                <div class="form-group">
                    <label for="SkinThickness">Skin Thickness</label>
                    <input
                        type="number"
                        step="any"
                        name="SkinThickness"
                        id="SkinThickness"
                        required>
                </div>

                <div class="form-group">
                    <label for="Insulin">Insulin</label>
                    <input
                        type="number"
                        step="any"
                        name="Insulin"
                        id="Insulin"
                        required>
                </div>

                <div class="form-group">
                    <label for="BMI">BMI</label>
                    <input
                        type="number"
                        step="any"
                        name="BMI"
                        id="BMI"
                        required>
                </div>

                <div class="form-group">
                    <label for="DiabetesPedigreeFunction">
                        Diabetes Pedigree Function
                    </label>
                    <input
                        type="number"
                        step="any"
                        name="DiabetesPedigreeFunction"
                        id="DiabetesPedigreeFunction"
                        required>
                </div>

                <div class="form-group">
                    <label for="Age">Age</label>
                    <input
                        type="number"
                        step="any"
                        name="Age"
                        id="Age"
                        required>
                </div>

            </div>

            <button type="submit">
                Predict Diabetes
            </button>

        </form>

        {% if prediction %}

        <div class="result">
            <h2>{{ prediction }}</h2>

            <p>
                Diabetes Probability:
                <strong>{{ probability }}%</strong>
            </p>
        </div>

        {% endif %}

        {% if error %}

        <div class="error">
            {{ error }}
        </div>

        {% endif %}

    </div>

</body>

</html>
